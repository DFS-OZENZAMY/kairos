name: Déployer sur Cloudflare

# Déploiement manuel de secours (onglet Actions > Run workflow).
# La voie recommandée est le build Git intégré de Cloudflare (voir README).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Identifier le compte Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Ajoute le secret CLOUDFLARE_API_TOKEN dans Settings > Secrets and variables > Actions"; exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty')
            if [ -z "$ID" ]; then
              echo "::error::Compte introuvable. Ajoute le secret CLOUDFLARE_ACCOUNT_ID, ou donne au token la permission Account Settings: Read"; exit 1
            fi
            echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          fi

      - name: Déployer (la base D1 est créée automatiquement si besoin)
        run: npx wrangler deploy
