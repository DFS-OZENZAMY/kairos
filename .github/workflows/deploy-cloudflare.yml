name: Déployer sur Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Identifier le compte Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Ajoute le secret CLOUDFLARE_API_TOKEN dans Settings > Secrets and variables > Actions"; exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty')
            if [ -z "$ID" ]; then
              echo "::error::Compte introuvable. Ajoute le secret CLOUDFLARE_ACCOUNT_ID, ou donne au token la permission Account Settings: Read"; exit 1
            fi
            echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          fi

      - name: Créer ou retrouver la base D1
        run: node scripts/ensure-d1.mjs

      - name: Appliquer le schéma de la base
        run: npx wrangler d1 migrations apply kairos-db --remote

      - name: Déployer le Worker et l'application
        run: npx wrangler deploy

      - name: Enregistrer l'ID de la base dans le dépôt
        run: |
          if ! git diff --quiet wrangler.jsonc; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: ID de la base D1 [skip ci]"
            git push
          fi
