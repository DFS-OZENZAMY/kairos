<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151A31">
  <meta name="description" content="Kairos : ta journée, tes mots de passe et tes codes 2FA, chiffrés sur ton appareil.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Kairos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('kairos.prefs') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="lock" class="lock" hidden></div>

  <div id="app" class="app" hidden>
    <nav class="rail" aria-label="Navigation principale">
      <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#logo"/></svg>Kairos</div>
      <button class="rail-search" data-act="palette" type="button">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Rechercher <kbd>Ctrl K</kbd>
      </button>
      <div class="nav" id="nav"></div>
      <div class="rail-foot">
        <button class="btn ghost" data-act="lock" type="button">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          Verrouiller
        </button>
      </div>
    </nav>
    <div>
      <header class="topbar">
        <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true" width="26" height="26"><use href="#logo"/></svg>Kairos</div>
        <button class="icon-btn" data-act="palette" type="button" aria-label="Rechercher">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" data-act="lock" type="button" aria-label="Verrouiller">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="modal" aria-label="Fenêtre"></dialog>
  <dialog id="palette" aria-label="Recherche rapide"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="16" fill="#151A31"/>
      <circle cx="32" cy="32" r="20" fill="none" stroke="#7486FF" stroke-width="3.5" stroke-dasharray="94 32" stroke-linecap="round" transform="rotate(-90 32 32)"/>
      <circle cx="32" cy="28" r="6" fill="#F8F9FC"/>
      <path d="M29 31h6l2 12h-10z" fill="#F8F9FC"/>
    </symbol>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
